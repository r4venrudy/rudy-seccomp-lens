name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Replace stale PR checks; keep push, release, and manual runs independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: ${{ matrix.os }} / C++20
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Configure sanitizer build
        if: runner.os == 'Linux'
        run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DRSL_ENABLE_SANITIZERS=ON
      - name: Build sanitizer tests
        if: runner.os == 'Linux'
        run: cmake --build build-sanitized --parallel 2
      - name: Test with sanitizers
        if: runner.os == 'Linux'
        run: ctest --test-dir build-sanitized --output-on-failure
