name: Package release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release to attach packages to
        required: true
        type: string
        default: v0.1.0

permissions:
  contents: write

# Do not overlap publication attempts for the same release ref.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: Package ${{ matrix.os }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install package files
        run: cmake --install build --config Release --prefix stage
      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path stage\* -DestinationPath "rudy-seccomp-lens-$($env:RELEASE_TAG)-windows-x64.zip"
      - name: Create Unix archive
        if: runner.os != 'Windows'
        run: tar -czf "rudy-seccomp-lens-${RELEASE_TAG}-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" -C stage .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-${{ matrix.os }}
          path: rudy-seccomp-lens-${{ env.RELEASE_TAG }}-*
          if-no-files-found: error

  publish:
    needs: package
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum rudy-seccomp-lens-* > SHA256SUMS.txt
      - name: Verify release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG"
      - name: Upload packages to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/release_guard.py dist
          gh release upload "$RELEASE_TAG" dist/* --clobber
