name: Package release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install package files
        run: cmake --install build --config Release --prefix stage
      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path stage\* -DestinationPath "rudy-seccomp-lens-${{ github.ref_name }}-windows-x64.zip"
      - name: Create Unix archive
        if: runner.os != 'Windows'
        run: tar -czf "rudy-seccomp-lens-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}.tar.gz" -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: rudy-seccomp-lens-${{ github.ref_name }}-*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum rudy-seccomp-lens-* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "Rudy Seccomp Lens ${GITHUB_REF_NAME}" --generate-notes
